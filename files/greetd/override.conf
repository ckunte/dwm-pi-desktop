# Debian's greetd.service is tied to tty7; we run on vt=1 (see config.toml),
# so order after / displace getty@tty1 instead. cloud-init.target keeps its
# first-boot console output from garbling tuigreet's prompt.
[Unit]
After=
After=systemd-user-sessions.service systemd-logind.service plymouth-quit-wait.service getty@tty1.service cloud-init.target
Conflicts=
Conflicts=getty@tty1.service
