# Under full KMS the Pi exposes two DRM devices (vc4 for scanout, v3d for
# 3D only). Without a hint Xorg can pick v3d as primary and die with
# "Cannot run in framebuffer mode". Bind vc4 as the primary GPU.
Section "OutputClass"
	Identifier "vc4"
	MatchDriver "vc4"
	Driver "modesetting"
	Option "PrimaryGPU" "true"
EndSection
